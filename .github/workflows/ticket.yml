name: ticket
# Generic run name: this repo is public, branch and ticket names stay out of the run list.
run-name: ticket

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Task number in the private task repo"
        required: true
      model:
        description: "Claude model: auto = Opus plans and takes over what Sonnet could not fix, Sonnet codes"
        default: auto
      work:
        description: "Let Claude continue the code (off = only test what is on the branch)"
        type: boolean
        default: true
      ios:
        description: "QC on an iOS simulator (staging build, light/dark/RTL, Jira QC test cases, Figma)"
        type: boolean
        default: true
      android:
        description: "QC on an Android emulator (same checks)"
        type: boolean
        default: true
      qc:
        description: "Run Claude QC + reports (off = only build and install the app, to measure speed)"
        type: boolean
        default: true
      account:
        description: "Preferred Claude account 1-3, or auto. Accounts at >=90% weekly quota with >1 day to reset are skipped."
        default: auto

permissions: {}

concurrency:
  group: ticket-${{ inputs.issue }}

jobs:
  work:
    if: ${{ inputs.work }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults: { run: { shell: bash } }
    env:
      ISSUE: ${{ inputs.issue }}
    # Public repo: no step may print code, diffs, Claude output or ticket content.
    # The task (branch, Jira key, notes) lives in a private repo; values are masked as soon as they are read.
    steps:
      - uses: actions/checkout@v4
        with: { path: runner }

      - name: task
        env:
          GH_TOKEN: ${{ secrets.TASKS_PAT }}
          TASKS_REPO: ${{ secrets.TASKS_REPO }}
        run: |
          mkdir -p ctx
          gh api "repos/$TASKS_REPO/issues/$ISSUE" --jq .body > ctx/task.md
          gh api "repos/$TASKS_REPO/issues/$ISSUE" --jq '[.labels[].name|select(startswith("fix-round-"))|ltrimstr("fix-round-")|tonumber]|max // 0' > ctx/fix-round
          branch=$(grep -m1 -oE '^branch:[[:space:]]*\S+' ctx/task.md | sed -E 's/^branch:[[:space:]]*//')
          key=$(grep -m1 -oE '(US|UTD|UOB)-[0-9]+' <<<"$branch")
          [ -n "$branch" ] && [ -n "$key" ] || { echo "task has no branch line"; exit 1; }
          echo "::add-mask::$branch"; echo "::add-mask::$key"; echo "::add-mask::${branch##*/}"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"; echo "KEY=$key" >> "$GITHUB_ENV"
          keys=$(grep -oE '(US|UTD|UOB)-[0-9]+' ctx/task.md | sort -u | tr '\n' ' '); for k in $keys; do echo "::add-mask::$k"; done
          echo "KEYS=$keys" >> "$GITHUB_ENV"
          gh api -X POST "repos/$TASKS_REPO/issues/$ISSUE/labels" -f "labels[]=running" >/dev/null
          gh api -X DELETE "repos/$TASKS_REPO/issues/$ISSUE/labels/todo" >/dev/null 2>&1 || true

      - name: progress
        if: ${{ !cancelled() }}
        env: { GH_TOKEN: "${{ secrets.TASKS_PAT }}", TASKS_REPO: "${{ secrets.TASKS_REPO }}", WORKER: "${{ inputs.issue }}" }
        run: WORKER="$ISSUE" python3 -I runner/scripts/progress.py "$ISSUE" code "Clone nhánh + cài dependency"
      - name: clone
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT: ${{ secrets.GITLAB_PROJECT }}
        run: |
          auth="Authorization: Basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          if git -c http.extraHeader="$auth" clone -q --depth 60 --branch "$BRANCH" "https://gitlab.com/$GITLAB_PROJECT.git" app 2>/dev/null; then
            echo "BASE_REF=origin/$BRANCH" >> "$GITHUB_ENV"
          else  # new ticket: cut the branch from app-develop; the runner's work lands on runner/<branch>
            git -c http.extraHeader="$auth" clone -q --depth 60 --branch app-develop "https://gitlab.com/$GITLAB_PROJECT.git" app
            git -C app checkout -q -b "$BRANCH"; echo "BASE_REF=origin/app-develop" >> "$GITHUB_ENV"; echo "new branch from app-develop"
          fi
          git -C app -c http.extraHeader="$auth" fetch -q --depth 200 origin app-develop:refs/remotes/origin/app-develop
          git -C app config user.name "percy (runner)"
          git -C app config user.email 62367533+nguyenphp@users.noreply.github.com

      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/cache@v4
        with:
          path: app/node_modules
          key: nm-${{ hashFiles('app/yarn.lock', 'app/patches/**') }}
      - name: install
        working-directory: app
        env: { HUSKY: '0' }
        run: yarn install --frozen-lockfile --ignore-engines --network-timeout 600000 >/dev/null 2>&1 || yarn install --ignore-engines >/dev/null 2>&1

      - name: progress
        if: ${{ !cancelled() }}
        env: { GH_TOKEN: "${{ secrets.TASKS_PAT }}", TASKS_REPO: "${{ secrets.TASKS_REPO }}", WORKER: "${{ inputs.issue }}" }
        run: WORKER="$ISSUE" python3 -I runner/scripts/progress.py "$ISSUE" code "Đọc Jira, Confluence, Figma"
      - name: context
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          mkdir -p ctx/figma
          for k in ${KEYS:-$KEY}; do python3 -I runner/scripts/ticket-context.py "$k" "ctx/c-$k.md" >/dev/null; done
          cat ctx/c-*.md > ctx/context.md; echo "context: $(echo ${KEYS:-$KEY} | wc -w | tr -d ' ') ticket(s)"
          python3 -I runner/scripts/figma-render.py ctx/context.md ctx/figma

      - name: pick account
        id: pick
        env:
          CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
        run: |
          n=$(python3 -I runner/scripts/pick-account.py "${{ inputs.account }}") || { echo "no Claude account has quota left" > ctx/report.md; exit 1; }
          echo "n=$n" >> "$GITHUB_OUTPUT"; echo "using account $n"

      - name: progress
        if: ${{ !cancelled() }}
        env: { GH_TOKEN: "${{ secrets.TASKS_PAT }}", TASKS_REPO: "${{ secrets.TASKS_REPO }}", WORKER: "${{ inputs.issue }}" }
        run: WORKER="$ISSUE" python3 -I runner/scripts/progress.py "$ISSUE" code "Claude đang code + verify/jest"
      - name: claude
        working-directory: app
        env:
          T1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          T2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          T3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
          ACC: ${{ steps.pick.outputs.n }}
        run: |
          npm i -g --silent @anthropic-ai/claude-code >/dev/null 2>&1
          before=$(git rev-parse HEAD)
          prompt="$(cat ../runner/prompts/ticket.md)"$'\n\n'"Ticket(s): ${KEYS:-$KEY}. Branch: $BRANCH. Task notes from the developer (follow them): ../ctx/task.md"
          TRIED="$ACC"; T0=$(date +%s)
          run() {  # run <model> <message> [extra args]: switches account and resumes when one runs out
            local model=$1 msg=$2 resume="" next; shift 2
            while :; do
              tv="T$ACC"
              CLAUDE_CODE_OAUTH_TOKEN="${!tv}" T1= T2= T3= perl -e 'alarm shift; exec @ARGV' $(( 7800 - $(date +%s) + T0 )) \
                claude -p "$msg" ${resume:+--resume "$resume"} --model "$model" --dangerously-skip-permissions \
                --add-dir ../ctx --output-format json "$@" > ../ctx/claude.json 2>/dev/null || echo "claude exited non-zero"
              grep -qiE "hit your (session|usage|weekly) limit|usage limit reached" ../ctx/claude.json || return 0
              next=$(EXCLUDE="$TRIED" CLAUDE_CODE_OAUTH_TOKEN_1="$T1" CLAUDE_CODE_OAUTH_TOKEN_2="$T2" CLAUDE_CODE_OAUTH_TOKEN_3="$T3" \
                python3 -I ../runner/scripts/pick-account.py auto 2>/dev/null) || return 1
              resume=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("session_id",""))' ../ctx/claude.json 2>/dev/null)
              [ -n "$resume" ] && msg="Your Claude account ran out mid-task; continue exactly where you stopped."
              echo "account $ACC ran out, switching to $next"; ACC=$next; TRIED="$TRIED$ACC"
            done
          }
          NO_PUSH=(--disallowedTools "Bash(git push*)" "Bash(curl*)" "Bash(wget*)" WebFetch WebSearch)
          M="${{ inputs.model }}"; ROUND=$(cat ../ctx/fix-round 2>/dev/null || echo 0)
          if [ "$M" != auto ]; then run "$M" "$prompt" "${NO_PUSH[@]}"
          else
            # Sonnet already failed a fix round on this task → Opus takes over.
            if [ "$ROUND" -ge 2 ]; then CODER=opus; else CODER=sonnet; fi
            if [ "$ROUND" = 0 ]; then  # new work: Opus plans (read-only), Sonnet follows the plan
              echo "plan: opus"
              run opus "$prompt"$'\n\n'"PLANNING ONLY: read everything, then write a concrete step-by-step plan (files, functions, edge cases, tests) to ../ctx/plan.md. Do not edit app code." \
                --disallowedTools Edit "Bash(git *)" "Bash(curl*)" "Bash(wget*)" WebFetch WebSearch
              [ -s ../ctx/plan.md ] && prompt="$prompt"$'\n'"Follow the plan in ../ctx/plan.md (made by a senior engineer)."
            fi
            echo "code: $CODER (fix round $ROUND)"; run "$CODER" "$prompt" "${NO_PUSH[@]}"
            # Sonnet changed nothing → Opus tries once.
            if [ "$CODER" = sonnet ] && git diff --quiet "$before" && [ -z "$(git status --porcelain)" ]; then
              echo "sonnet made no change: opus takes over"; run opus "$prompt" "${NO_PUSH[@]}"
            fi
          fi
          # Claude often leaves its work uncommitted: commit it here, minus files the team never commits.
          git add -A -- . ':!*.md' ':!Gemfile.lock' ':!ReactotronConfig.js' ':!ios/uniscore.xcodeproj/project.pbxproj' 2>/dev/null || true
          git diff --cached --quiet || git commit -qm "$(echo ${KEYS:-$KEY} | cut -d' ' -f1) fix: runner changes for QC" --no-verify
          echo "new commits: $(git rev-list --count "$before"..HEAD), changed files: $(git diff --name-only "$before"..HEAD | wc -l | tr -d ' ')"
          python3 -c "import json;d=json.load(open('../ctx/claude.json'));print('turns',d.get('num_turns'),'cost',round(d.get('total_cost_usd',0),2),'error',d.get('is_error'))" || true

      - name: progress
        if: ${{ !cancelled() }}
        env: { GH_TOKEN: "${{ secrets.TASKS_PAT }}", TASKS_REPO: "${{ secrets.TASKS_REPO }}", WORKER: "${{ inputs.issue }}" }
        run: WORKER="$ISSUE" python3 -I runner/scripts/progress.py "$ISSUE" code "Đẩy code lên nhánh runner"
      - name: push runner branch
        if: ${{ !cancelled() }}
        working-directory: app
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          [ "$(git rev-list --count "${BASE_REF:-origin/$BRANCH}..HEAD" 2>/dev/null || echo 0)" = 0 ] && { echo "nothing to push"; exit 0; }
          auth="Authorization: Basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          # The developer's branch is never touched: work lands on runner/<branch> for review.
          git -c http.extraHeader="$auth" push -q --force origin "HEAD:refs/heads/runner/$BRANCH" && echo "PUSHED=1" >> "$GITHUB_ENV" && echo "pushed runner branch"

      - name: progress
        if: ${{ !cancelled() }}
        env: { GH_TOKEN: "${{ secrets.TASKS_PAT }}", TASKS_REPO: "${{ secrets.TASKS_REPO }}", WORKER: "${{ inputs.issue }}" }
        run: WORKER="$ISSUE" python3 -I runner/scripts/progress.py "$ISSUE" code "Gửi báo cáo"
      - name: report
        # A cancelled run (e.g. moved to another account) says nothing; it will report when it reruns.
        if: ${{ !cancelled() }}
        env:
          TG_TICKET_BOT_TOKEN: ${{ secrets.TG_TICKET_BOT_TOKEN }}
          TG_NOTIFY_CHAT_ID: ${{ secrets.TG_NOTIFY_CHAT_ID }}
          TG_SQUAD_TOPICS: ${{ secrets.TG_SQUAD_TOPICS }}
          GITLAB_PROJECT: ${{ secrets.GITLAB_PROJECT }}
          GH_TOKEN: ${{ secrets.TASKS_PAT }}
          TASKS_REPO: ${{ secrets.TASKS_REPO }}
        run: |
          [ -s ctx/report.md ] || echo "(Claude không viết report)" > ctx/report.md
          [ "${PUSHED:-}" = 1 ] && printf '\n\nCode runner thêm (so với nhánh của bạn): https://gitlab.com/%s/-/compare/%s...runner/%s\n' "$GITLAB_PROJECT" "$BRANCH" "$BRANCH" >> ctx/report.md
          [ "${PUSHED:-}" = 1 ] || printf '\n\nRunner không thêm commit nào.\n' >> ctx/report.md
          gh api -X POST "repos/$TASKS_REPO/issues/$ISSUE/comments" -F body=@ctx/report.md >/dev/null
          gh api -X DELETE "repos/$TASKS_REPO/issues/$ISSUE/labels/running" >/dev/null 2>&1 || true
          label=$([ "${{ job.status }}" = success ] && echo done || echo blocked)
          gh api -X POST "repos/$TASKS_REPO/issues/$ISSUE/labels" -f "labels[]=$label" >/dev/null
          printf '\nTask: https://github.com/%s/issues/%s\n' "$TASKS_REPO" "$ISSUE" >> ctx/report.md
          python3 -I runner/scripts/short.py ctx/report.md ctx/report-short.md 3
          printf '\nChi tiết: https://github.com/%s/issues/%s\n' "$TASKS_REPO" "$ISSUE" >> ctx/report-short.md
          python3 -I runner/scripts/tg-report.py ctx/report-short.md ctx/context.md "$KEY · code xong (${{ job.status }}) · task #$ISSUE"

  # During a shift the warm workers take the QC (labels <platform>-todo); otherwise the cold jobs below run.
  route:
    needs: work
    if: ${{ !cancelled() && (inputs.ios || inputs.android) }}
    runs-on: ubuntu-latest
    permissions: { actions: read }
    outputs:
      shift: ${{ steps.r.outputs.shift }}
    steps:
      - id: r
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.TASKS_PAT }}
          TASKS_REPO: ${{ secrets.TASKS_REPO }}
          ISSUE: ${{ inputs.issue }}
        run: |
          active=$(GH_TOKEN=$ACTIONS_TOKEN gh api "repos/${{ github.repository }}/actions/workflows/shift.yml/runs?status=in_progress" --jq '.total_count' 2>/dev/null || echo 0)
          if [ "${active:-0}" -gt 0 ] && [ "${{ inputs.qc }}" = true ]; then  # speed tests always build cold
            [ "${{ inputs.ios }}" = true ] && gh api -X POST "repos/$TASKS_REPO/issues/$ISSUE/labels" -f "labels[]=ios-todo" >/dev/null
            [ "${{ inputs.android }}" = true ] && gh api -X POST "repos/$TASKS_REPO/issues/$ISSUE/labels" -f "labels[]=android-todo" >/dev/null
            echo "shift=1" >> "$GITHUB_OUTPUT"; echo "queued for the shift"
          else
            echo "shift=0" >> "$GITHUB_OUTPUT"; echo "no shift running: cold build"
          fi

  # QC on real builds: staging app on an iOS simulator and an Android emulator, light/dark/RTL vs Figma + QC test cases.
  ios:
    needs: [work, route]
    if: ${{ !cancelled() && inputs.ios && needs.route.outputs.shift != '1' }}
    # Prebuilt pods (Braze…) need the Swift 6.2+ runtime, i.e. Xcode 26+; the team builds with Xcode 27.
    runs-on: macos-26
    timeout-minutes: 150
    defaults: { run: { shell: bash } }
    env:
      ISSUE: ${{ inputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with: { path: runner }

      - name: task
        env:
          GH_TOKEN: ${{ secrets.TASKS_PAT }}
          TASKS_REPO: ${{ secrets.TASKS_REPO }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT: ${{ secrets.GITLAB_PROJECT }}
        run: |
          mkdir -p ctx/figma shots
          gh api "repos/$TASKS_REPO/issues/$ISSUE" --jq .body > ctx/task.md
          branch=$(grep -m1 -oE '^branch:[[:space:]]*\S+' ctx/task.md | sed -E 's/^branch:[[:space:]]*//')
          key=$(grep -m1 -oE '(US|UTD|UOB)-[0-9]+' <<<"$branch")
          echo "::add-mask::$branch"; echo "::add-mask::$key"; echo "::add-mask::${branch##*/}"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"; echo "KEY=$key" >> "$GITHUB_ENV"
          keys=$(grep -oE '(US|UTD|UOB)-[0-9]+' ctx/task.md | sort -u | tr '\n' ' '); for k in $keys; do echo "::add-mask::$k"; done
          echo "KEYS=$keys" >> "$GITHUB_ENV"
          auth="Authorization: Basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 | tr -d '\n')"
          # Test what the runner produced when it pushed something, else the developer's branch.
          ref="$branch"; git -c http.extraHeader="$auth" ls-remote --exit-code --heads "https://gitlab.com/$GITLAB_PROJECT.git" "runner/$branch" >/dev/null 2>&1 && ref="runner/$branch"
          git -c http.extraHeader="$auth" clone -q --depth 1 --branch "$ref" "https://gitlab.com/$GITLAB_PROJECT.git" app
          echo "testing $([ "$ref" = "$branch" ] && echo developer || echo runner) branch"

      - name: context
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          for k in ${KEYS:-$KEY}; do python3 -I runner/scripts/ticket-context.py "$k" "ctx/c-$k.md" >/dev/null; done
          cat ctx/c-*.md > ctx/context.md; echo "context: $(echo ${KEYS:-$KEY} | wc -w | tr -d ' ') ticket(s)"
          python3 -I runner/scripts/figma-render.py ctx/context.md ctx/figma

      # Fetch Maestro in the background. Do NOT pre-boot the simulator here: on the 3-core runner it slowed
      # every later step 2-3x and the half-booted device failed simctl install (exit 149).
      - name: prewarm
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)" >/dev/null
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for r in sorted(d,reverse=True) if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone') and x['name'].endswith('Pro')))")
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          nohup bash -c 'curl -Ls "https://get.maestro.mobile.dev" | bash >/dev/null 2>&1; touch ~/.maestro-ok' >/dev/null 2>&1 &
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/cache/restore@v4
        id: deps
        with:
          path: |
            app/node_modules
            app/ios/Pods
          key: ios-${{ runner.arch }}-${{ hashFiles('app/yarn.lock', 'app/patches/**', 'app/ios/Podfile') }}
          restore-keys: ios-${{ runner.arch }}-
      # Prebuilt staging .app keyed by everything native: a JS-only branch reuses it and only re-bundles the JS.
      - name: native key
        run: echo "NATIVE_KEY=ios-app-${{ runner.arch }}-${{ hashFiles('app/ios/**', '!app/ios/Pods/**', '!app/ios/build/**', 'app/yarn.lock', 'app/package.json', 'app/patches/**', 'app/.env*') }}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: appcache
        with: { path: prebuilt, key: "${{ env.NATIVE_KEY }}" }
      - name: install
        working-directory: app
        env: { HUSKY: '0' }
        run: |
          yarn install --frozen-lockfile --ignore-engines --network-timeout 600000 >/dev/null 2>&1 || yarn install --ignore-engines >/dev/null 2>&1
          [ "${{ steps.appcache.outputs.cache-hit }}" = true ] && { echo "prebuilt app hit: skipping pods"; exit 0; }
          cd ios && bundle install --quiet >/dev/null 2>&1 && bundle exec pod install >/tmp/pod.log 2>&1 && echo "pods ok" || { echo "pod install failed"; exit 1; }
      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            app/node_modules
            app/ios/Pods
          key: ios-${{ runner.arch }}-${{ hashFiles('app/yarn.lock', 'app/patches/**', 'app/ios/Podfile') }}

      - name: build
        if: steps.appcache.outputs.cache-hit != 'true'
        working-directory: app/ios
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)" >/dev/null
          echo "$(xcodebuild -version | head -1)"
          set -o pipefail
          A=$(uname -m); X=$([ "$A" = arm64 ] && echo x86_64 || echo arm64)
          xcodebuild -workspace uniscore.xcworkspace -scheme uniscoreStag -configuration ReleaseStag -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ../../build \
            ARCHS=$A ONLY_ACTIVE_ARCH=YES EXCLUDED_ARCHS=$X \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO DEBUG_INFORMATION_FORMAT=dwarf -quiet > /tmp/build.log 2>&1 \
            && echo "build ok" || {
              echo "build failed: $(grep -c ' error: ' /tmp/build.log) errors"
              # Private report only (public log prints counts): compiler errors + the linker's real reason.
              { grep ' error: ' /tmp/build.log | head -15
                grep -E '^ld: |Undefined symbols|referenced from|building for' /tmp/build.log | grep -v 'ld: warning' | sort -u | head -25; } > ../../ctx/build-errors.txt
              exit 1; }
          mkdir -p ../../prebuilt && cp -R ../../build/Build/Products/ReleaseStag-iphonesimulator/*.app ../../prebuilt/
      - uses: actions/cache/save@v4
        if: steps.appcache.outputs.cache-hit != 'true'
        with: { path: prebuilt, key: "${{ env.NATIVE_KEY }}" }
      - name: js bundle
        if: steps.appcache.outputs.cache-hit == 'true'
        working-directory: app
        run: |
          bash ../runner/scripts/ios-js-swap.sh "$(ls -d ../prebuilt/*.app | grep -v Extension | head -1)" && echo "js swapped into prebuilt app" \
            || { echo "js bundle failed"; echo "JS bundle lỗi (Metro)." > ../ctx/build-errors.txt; exit 1; }

      - name: simulator
        run: |
          app=$(ls -d prebuilt/*.app | grep -v Extension | head -1)
          xcrun simctl boot "$SIM_UDID" && xcrun simctl bootstatus "$SIM_UDID" -b >/dev/null
          xcrun simctl install "$SIM_UDID" "$app" || { sleep 10; xcrun simctl install "$SIM_UDID" "$app"; }
          echo "APP_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" >> "$GITHUB_ENV"
          for i in $(seq 90); do [ -f ~/.maestro-ok ] && break; sleep 2; done; echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          echo "simulator ready"

      - name: pick account
        if: ${{ inputs.qc }}
        id: pick
        env:
          CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
        run: |
          n=$(python3 -I runner/scripts/pick-account.py "${{ inputs.account }}") || { echo "no Claude account has quota left"; exit 1; }
          echo "n=$n" >> "$GITHUB_OUTPUT"; echo "using account $n"

      - name: rulebook
        if: ${{ inputs.qc }}
        env: { GH_TOKEN: "${{ secrets.TASKS_PAT }}", TASKS_REPO: "${{ secrets.TASKS_REPO }}" }
        run: |
          python3 -I runner/scripts/lessons.py get ctx/lessons.md
          python3 -I runner/scripts/flows.py get ctx/flows || true
          python3 -I runner/scripts/flows.py get ctx/scenarios "scenarios/$KEY" || true
          python3 -I runner/scripts/task-files.py get "$ISSUE" android ctx/peer >/dev/null 2>&1; [ -s ctx/peer/test-data.json ] && cp ctx/peer/test-data.json ctx/peer-test-data.json || true

      - name: qc
        if: ${{ inputs.qc }}
        working-directory: app
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.pick.outputs.n == '2' && secrets.CLAUDE_CODE_OAUTH_TOKEN_2 || steps.pick.outputs.n == '3' && secrets.CLAUDE_CODE_OAUTH_TOKEN_3 || secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
        run: |
          npm i -g --silent @anthropic-ai/claude-code >/dev/null 2>&1
          date +%s > ../ctx/qc-start
          prompt="$(cat ../runner/prompts/qc.md; echo; sed "s/\$APP_ID/$APP_ID/g" ../runner/prompts/qc-ios.md)"$'\n\n'"Ticket: $KEY."
          perl -e 'alarm shift; exec @ARGV' 2100 claude -p "$prompt" --model "${{ inputs.model == 'auto' && 'sonnet' || inputs.model }}" --dangerously-skip-permissions \
            --add-dir ../ctx --add-dir ../shots --output-format json \
            --disallowedTools Edit Write "Bash(git *)" "Bash(curl*)" WebFetch WebSearch \
            > ../ctx/qc.json 2>/dev/null || echo "claude exited non-zero"
          echo "shots: $(ls ../shots | wc -l)"

      - name: learn
        if: ${{ (!cancelled()) && inputs.qc }}
        env: { GH_TOKEN: "${{ secrets.TASKS_PAT }}", TASKS_REPO: "${{ secrets.TASKS_REPO }}", PLATFORM: ios }
        run: |
          python3 -I runner/scripts/lessons.py add ctx/lessons-new.md || true
          python3 -I runner/scripts/flows.py put ctx/flows-new || true
          python3 -I runner/scripts/flows.py put ctx/scenarios-new "scenarios/$KEY" || true
          python3 -I runner/scripts/qc-metrics.py add "$PLATFORM" || true

      - name: store result
        if: ${{ (!cancelled()) && inputs.qc }}
        env:
          GH_TOKEN: ${{ secrets.TASKS_PAT }}
          TASKS_REPO: ${{ secrets.TASKS_REPO }}
          TG_TICKET_BOT_TOKEN: ${{ secrets.TG_TICKET_BOT_TOKEN }}
          TG_NOTIFY_CHAT_ID: ${{ secrets.TG_NOTIFY_CHAT_ID }}
        run: bash runner/scripts/qc-report.sh ios "${{ job.status }}"
      # Bugs found: the app is about to change, so stop the other platform's QC now and let the fix round start
      # (it waits on this run: one run per task). Android usually finishes first, so iOS only tests the fixed app.
      - name: stop for fix
        if: ${{ !cancelled() && inputs.qc }}
        env: { GH_TOKEN: "${{ secrets.TASKS_PAT }}" }
        run: |
          [ "$(cat ctx/qc-status 2>/dev/null)" = fixing ] || exit 0
          echo "bugs to fix: stopping this run so the fix round starts now"
          gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"

  android:
    needs: [work, route]
    if: ${{ !cancelled() && inputs.android && needs.route.outputs.shift != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults: { run: { shell: bash } }
    env:
      ISSUE: ${{ inputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with: { path: runner }

      - name: task
        env:
          GH_TOKEN: ${{ secrets.TASKS_PAT }}
          TASKS_REPO: ${{ secrets.TASKS_REPO }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT: ${{ secrets.GITLAB_PROJECT }}
        run: |
          mkdir -p ctx/figma shots
          gh api "repos/$TASKS_REPO/issues/$ISSUE" --jq .body > ctx/task.md
          branch=$(grep -m1 -oE '^branch:[[:space:]]*\S+' ctx/task.md | sed -E 's/^branch:[[:space:]]*//')
          key=$(grep -m1 -oE '(US|UTD|UOB)-[0-9]+' <<<"$branch")
          echo "::add-mask::$branch"; echo "::add-mask::$key"; echo "::add-mask::${branch##*/}"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"; echo "KEY=$key" >> "$GITHUB_ENV"
          keys=$(grep -oE '(US|UTD|UOB)-[0-9]+' ctx/task.md | sort -u | tr '\n' ' '); for k in $keys; do echo "::add-mask::$k"; done
          echo "KEYS=$keys" >> "$GITHUB_ENV"
          auth="Authorization: Basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 | tr -d '\n')"
          # Test what the runner produced when it pushed something, else the developer's branch.
          ref="$branch"; git -c http.extraHeader="$auth" ls-remote --exit-code --heads "https://gitlab.com/$GITLAB_PROJECT.git" "runner/$branch" >/dev/null 2>&1 && ref="runner/$branch"
          git -c http.extraHeader="$auth" clone -q --depth 1 --branch "$ref" "https://gitlab.com/$GITLAB_PROJECT.git" app
          echo "testing $([ "$ref" = "$branch" ] && echo developer || echo runner) branch"

      - name: context
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          for k in ${KEYS:-$KEY}; do python3 -I runner/scripts/ticket-context.py "$k" "ctx/c-$k.md" >/dev/null; done
          cat ctx/c-*.md > ctx/context.md; echo "context: $(echo ${KEYS:-$KEY} | wc -w | tr -d ' ') ticket(s)"
          python3 -I runner/scripts/figma-render.py ctx/context.md ctx/figma

      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      # Gradle checks inputs by content: restored build dirs make a JS-only rebuild ~bundle + package only.
      # Explicit save right after the build so a cancelled QC still keeps the cache.
      - name: gradle key
        run: echo "GRADLE_KEY=android-${{ hashFiles('app/yarn.lock', 'app/patches/**', 'app/android/**/*.gradle', 'app/android/gradle.properties') }}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: gradle
        with:
          path: |
            app/node_modules
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/android/.gradle
            app/android/build
            app/android/app/build
          key: ${{ env.GRADLE_KEY }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.GRADLE_KEY }}-
            android-
      - name: install
        working-directory: app
        env: { HUSKY: '0' }
        run: yarn install --frozen-lockfile --ignore-engines --network-timeout 600000 >/dev/null 2>&1 || yarn install --ignore-engines >/dev/null 2>&1

      - name: build
        working-directory: app/android
        env: { ENVFILE: .env.staging }
        run: |
          # ARM APK like the team ships; arm64 only (half the C++ compile), the x86_64 emulator runs it through ARM translation.
          set -o pipefail
          ./gradlew :app:assembleStagingRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a -q > /tmp/build.log 2>&1 \
            && echo "build ok" || {
              echo "build failed"
              { grep -E '^e: |error:|FAILURE|What went wrong' -A3 /tmp/build.log | head -40; } > ../../ctx/build-errors.txt
              exit 1; }
          echo "APK=$(ls "$PWD"/app/build/outputs/apk/staging/release/*.apk | head -1)" >> "$GITHUB_ENV"
      # Same Gradle setup as the restored cache: native outputs are already in it, skip the ~1 min upload.
      - uses: actions/cache/save@v4
        if: ${{ !startsWith(steps.gradle.outputs.cache-matched-key, format('{0}-', env.GRADLE_KEY)) }}
        with:
          path: |
            app/node_modules
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/android/.gradle
            app/android/build
            app/android/app/build
          key: ${{ env.GRADLE_KEY }}-${{ github.run_id }}

      - name: pick account
        if: ${{ inputs.qc }}
        id: pick
        env:
          CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
        run: |
          n=$(python3 -I runner/scripts/pick-account.py "${{ inputs.account }}") || { echo "no Claude account has quota left"; exit 1; }
          echo "n=$n" >> "$GITHUB_OUTPUT"; echo "using account $n"

      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          curl -Ls "https://get.maestro.mobile.dev" | bash >/dev/null 2>&1; echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: rulebook
        if: ${{ inputs.qc }}
        env: { GH_TOKEN: "${{ secrets.TASKS_PAT }}", TASKS_REPO: "${{ secrets.TASKS_REPO }}" }
        run: |
          python3 -I runner/scripts/lessons.py get ctx/lessons.md
          python3 -I runner/scripts/flows.py get ctx/flows || true
          python3 -I runner/scripts/flows.py get ctx/scenarios "scenarios/$KEY" || true
          python3 -I runner/scripts/task-files.py get "$ISSUE" ios ctx/peer >/dev/null 2>&1; [ -s ctx/peer/test-data.json ] && cp ctx/peer/test-data.json ctx/peer-test-data.json || true

      # Snapshot-booted AVD (cached once) instead of a cold boot every run.
      - uses: actions/cache/restore@v4
        id: avd
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_apis-pixel_7
      - name: avd snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "avd snapshot ready"
      - uses: actions/cache/save@v4
        if: steps.avd.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_apis-pixel_7
      - name: emulator + qc
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.pick.outputs.n == '2' && secrets.CLAUDE_CODE_OAUTH_TOKEN_2 || steps.pick.outputs.n == '3' && secrets.CLAUDE_CODE_OAUTH_TOKEN_3 || secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          MODEL: ${{ inputs.model == 'auto' && 'sonnet' || inputs.model }}
          QC: ${{ inputs.qc }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash runner/scripts/android-qc.sh

      - name: learn
        if: ${{ (!cancelled()) && inputs.qc }}
        env: { GH_TOKEN: "${{ secrets.TASKS_PAT }}", TASKS_REPO: "${{ secrets.TASKS_REPO }}", PLATFORM: android }
        run: |
          python3 -I runner/scripts/lessons.py add ctx/lessons-new.md || true
          python3 -I runner/scripts/flows.py put ctx/flows-new || true
          python3 -I runner/scripts/flows.py put ctx/scenarios-new "scenarios/$KEY" || true
          python3 -I runner/scripts/qc-metrics.py add "$PLATFORM" || true

      - name: store result
        if: ${{ (!cancelled()) && inputs.qc }}
        env:
          GH_TOKEN: ${{ secrets.TASKS_PAT }}
          TASKS_REPO: ${{ secrets.TASKS_REPO }}
          TG_TICKET_BOT_TOKEN: ${{ secrets.TG_TICKET_BOT_TOKEN }}
          TG_NOTIFY_CHAT_ID: ${{ secrets.TG_NOTIFY_CHAT_ID }}
        run: bash runner/scripts/qc-report.sh android "${{ job.status }}"
      # Bugs found: the app is about to change, so stop the other platform's QC now and let the fix round start
      # (it waits on this run: one run per task). Android usually finishes first, so iOS only tests the fixed app.
      - name: stop for fix
        if: ${{ !cancelled() && inputs.qc }}
        env: { GH_TOKEN: "${{ secrets.TASKS_PAT }}" }
        run: |
          [ "$(cat ctx/qc-status 2>/dev/null)" = fixing ] || exit 0
          echo "bugs to fix: stopping this run so the fix round starts now"
          gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"

  # One report for both platforms: one task comment, one Telegram message, one HTML.
  report:
    needs: [ios, android, route]
    if: ${{ !cancelled() && inputs.qc && (inputs.ios || inputs.android) && needs.route.outputs.shift != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ISSUE: ${{ inputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with: { path: runner }
      - name: collect
        env:
          GH_TOKEN: ${{ secrets.TASKS_PAT }}
          TASKS_REPO: ${{ secrets.TASKS_REPO }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          mkdir -p ctx/figma qc
          branch=$(gh api "repos/$TASKS_REPO/issues/$ISSUE" --jq .body | grep -m1 -oE '^branch:[[:space:]]*\S+' | sed -E 's/^branch:[[:space:]]*//')
          key=$(grep -m1 -oE '(US|UTD|UOB)-[0-9]+' <<<"$branch")
          echo "::add-mask::$branch"; echo "::add-mask::$key"; echo "::add-mask::${branch##*/}"
          echo "KEY=$key" >> "$GITHUB_ENV"
          keys=$(gh api "repos/$TASKS_REPO/issues/$ISSUE" --jq .body | grep -oE '(US|UTD|UOB)-[0-9]+' | sort -u); for k in $keys; do echo "::add-mask::$k"; done
          for k in $keys; do python3 -I runner/scripts/ticket-context.py "$k" "ctx/c-$k.md" >/dev/null; done; cat ctx/c-*.md > ctx/context.md
          python3 -I runner/scripts/figma-render.py ctx/context.md ctx/figma
          for p in ios android; do python3 -I runner/scripts/task-files.py get "$ISSUE" "$p" "qc/$p"; done
      - name: merge + send
        env:
          GH_TOKEN: ${{ secrets.TASKS_PAT }}
          TASKS_REPO: ${{ secrets.TASKS_REPO }}
          TG_TICKET_BOT_TOKEN: ${{ secrets.TG_TICKET_BOT_TOKEN }}
          TG_NOTIFY_CHAT_ID: ${{ secrets.TG_NOTIFY_CHAT_ID }}
          TG_SQUAD_TOPICS: ${{ secrets.TG_SQUAD_TOPICS }}
        run: |
          ls ctx/figma/*.png >/dev/null 2>&1 && python3 -I runner/scripts/task-files.py put "$ISSUE" figma ctx/figma/*.png
          python3 -I runner/scripts/merge-report.py "$KEY · QC iOS + Android · task #$ISSUE" ctx/figma qc "$ISSUE" out
          gh api -X POST "repos/$TASKS_REPO/issues/$ISSUE/comments" -F body=@out/comment.md >/dev/null
          python3 -I runner/scripts/tg-report.py out/telegram.md ctx/context.md "$KEY · QC iOS + Android · task #$ISSUE"
          python3 -I runner/scripts/tg-doc.py out/report.html ctx/context.md "$KEY · so sánh Figma | iOS | Android (mở file HTML)"

