name: ticket
# Generic run name: this repo is public, branch and ticket names stay out of the run list.
run-name: ticket

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Task number in the private task repo"
        required: true
      model:
        description: "Claude model"
        default: opus
      account:
        description: "Preferred Claude account 1-3, or auto. Accounts at >=90% weekly quota with >1 day to reset are skipped."
        default: auto

permissions: {}

concurrency:
  group: ticket-${{ inputs.issue }}

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults: { run: { shell: bash } }
    env:
      ISSUE: ${{ inputs.issue }}
    # Public repo: no step may print code, diffs, Claude output or ticket content.
    # The task (branch, Jira key, notes) lives in a private repo; values are masked as soon as they are read.
    steps:
      - uses: actions/checkout@v4
        with: { path: runner }

      - name: task
        env:
          GH_TOKEN: ${{ secrets.TASKS_PAT }}
          TASKS_REPO: ${{ secrets.TASKS_REPO }}
        run: |
          mkdir -p ctx
          gh api "repos/$TASKS_REPO/issues/$ISSUE" --jq .body > ctx/task.md
          branch=$(grep -m1 -oE '^branch:[[:space:]]*\S+' ctx/task.md | sed -E 's/^branch:[[:space:]]*//')
          key=$(grep -m1 -oE '(US|UTD|UOB)-[0-9]+' <<<"$branch")
          [ -n "$branch" ] && [ -n "$key" ] || { echo "task has no branch line"; exit 1; }
          echo "::add-mask::$branch"; echo "::add-mask::$key"; echo "::add-mask::${branch##*/}"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"; echo "KEY=$key" >> "$GITHUB_ENV"
          gh api -X POST "repos/$TASKS_REPO/issues/$ISSUE/labels" -f "labels[]=running" >/dev/null
          gh api -X DELETE "repos/$TASKS_REPO/issues/$ISSUE/labels/todo" >/dev/null 2>&1 || true

      - name: clone
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT: ${{ secrets.GITLAB_PROJECT }}
        run: |
          auth="Authorization: Basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" clone -q --depth 60 --branch "$BRANCH" "https://gitlab.com/$GITLAB_PROJECT.git" app
          git -C app -c http.extraHeader="$auth" fetch -q --depth 200 origin app-develop:refs/remotes/origin/app-develop
          git -C app config user.name "percy (runner)"
          git -C app config user.email 62367533+nguyenphp@users.noreply.github.com

      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/cache@v4
        with:
          path: app/node_modules
          key: nm-${{ hashFiles('app/yarn.lock', 'app/patches/**') }}
      - name: install
        working-directory: app
        env: { HUSKY: '0' }
        run: yarn install --frozen-lockfile --ignore-engines --network-timeout 600000 >/dev/null 2>&1 || yarn install --ignore-engines >/dev/null 2>&1

      - name: context
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          mkdir -p ctx/figma
          python3 -I runner/scripts/ticket-context.py "$KEY" ctx/context.md | sed 's#^.*(#context (#'
          python3 -I runner/scripts/figma-render.py ctx/context.md ctx/figma

      - name: pick account
        id: pick
        env:
          CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
        run: |
          n=$(python3 -I runner/scripts/pick-account.py "${{ inputs.account }}") || { echo "no Claude account has quota left" > ctx/report.md; exit 1; }
          echo "n=$n" >> "$GITHUB_OUTPUT"; echo "using account $n"

      - name: claude
        working-directory: app
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.pick.outputs.n == '2' && secrets.CLAUDE_CODE_OAUTH_TOKEN_2 || steps.pick.outputs.n == '3' && secrets.CLAUDE_CODE_OAUTH_TOKEN_3 || secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
        run: |
          npm i -g --silent @anthropic-ai/claude-code >/dev/null 2>&1
          before=$(git rev-parse HEAD)
          prompt="$(cat ../runner/prompts/ticket.md)"$'\n\n'"Ticket: $KEY. Branch: $BRANCH. Task notes from the developer (follow them): ../ctx/task.md"
          timeout 7800 claude -p "$prompt" --model "${{ inputs.model }}" --dangerously-skip-permissions \
            --add-dir ../ctx --output-format json \
            --disallowedTools "Bash(git push*)" "Bash(curl*)" "Bash(wget*)" WebFetch WebSearch \
            > ../ctx/claude.json 2>/dev/null || echo "claude exited non-zero"
          echo "new commits: $(git rev-list --count "$before"..HEAD)"
          python3 -c "import json;d=json.load(open('../ctx/claude.json'));print('turns',d.get('num_turns'),'cost',round(d.get('total_cost_usd',0),2),'error',d.get('is_error'))" || true

      - name: push runner branch
        if: always()
        working-directory: app
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          [ "$(git rev-list --count "origin/$BRANCH..HEAD" 2>/dev/null || echo 0)" = 0 ] && { echo "nothing to push"; exit 0; }
          auth="Authorization: Basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          # The developer's branch is never touched: work lands on runner/<branch> for review.
          git -c http.extraHeader="$auth" push -q --force origin "HEAD:refs/heads/runner/$BRANCH" && echo "pushed runner branch"

      - name: report
        if: always()
        env:
          TG_TICKET_BOT_TOKEN: ${{ secrets.TG_TICKET_BOT_TOKEN }}
          TG_NOTIFY_CHAT_ID: ${{ secrets.TG_NOTIFY_CHAT_ID }}
          TG_SQUAD_TOPICS: ${{ secrets.TG_SQUAD_TOPICS }}
          GITLAB_PROJECT: ${{ secrets.GITLAB_PROJECT }}
          GH_TOKEN: ${{ secrets.TASKS_PAT }}
          TASKS_REPO: ${{ secrets.TASKS_REPO }}
        run: |
          [ -s ctx/report.md ] || echo "(Claude không viết report)" > ctx/report.md
          printf '\n\nSo sánh: https://gitlab.com/%s/-/compare/%s...runner/%s\n' "$GITLAB_PROJECT" "$BRANCH" "$BRANCH" >> ctx/report.md
          gh api -X POST "repos/$TASKS_REPO/issues/$ISSUE/comments" -F body=@ctx/report.md >/dev/null
          gh api -X DELETE "repos/$TASKS_REPO/issues/$ISSUE/labels/running" >/dev/null 2>&1 || true
          label=$([ "${{ job.status }}" = success ] && echo done || echo blocked)
          gh api -X POST "repos/$TASKS_REPO/issues/$ISSUE/labels" -f "labels[]=$label" >/dev/null
          title="$KEY · runner xong (${{ job.status }}) · task #$ISSUE · nhánh runner/$BRANCH"
          printf '\nTask: https://github.com/%s/issues/%s\n' "$TASKS_REPO" "$ISSUE" >> ctx/report.md
          python3 -I runner/scripts/tg-report.py ctx/report.md ctx/context.md "$title"
