name: scan
# Schedules re-register on a push that touches this file.
# Rule-based Jira watcher (no LLM): new tasks/bugs, QC send-backs, @mentions → Telegram (only when something is new).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write  # state/scan-state.json (hashed keys only)
  actions: write   # auto-start the ticket workflow

concurrency: scan

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I scripts/scan.py
        env:
          SCAN_STATE: state/scan-state.json
          SCAN_HASH: "1"
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TG_TICKET_BOT_TOKEN: ${{ secrets.TG_TICKET_BOT_TOKEN }}
          TG_NOTIFY_CHAT_ID: ${{ secrets.TG_NOTIFY_CHAT_ID }}
          TG_SQUAD_TOPICS: ${{ secrets.TG_SQUAD_TOPICS }}
          TASKS_PAT: ${{ secrets.TASKS_PAT }}
          TASKS_REPO: ${{ secrets.TASKS_REPO }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT: ${{ secrets.GITLAB_PROJECT }}
          DISPATCH_TOKEN: ${{ github.token }}
      - name: save state
        run: |
          [ -z "$(git status --porcelain state)" ] && exit 0
          git config user.name percy-ticket-bot
          git config user.email 62367533+nguyenphp@users.noreply.github.com
          git add state && git commit -qm "state: scan" && git pull -q --rebase && git push -q
