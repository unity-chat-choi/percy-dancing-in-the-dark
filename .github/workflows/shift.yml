name: shift
run-name: shift
# Work-hours QC shifts: a warm iOS simulator + Android emulator take queued tasks (labels ios-todo / android-todo).
# 09:00-15:00 and 15:00-18:00 Vietnam time, Mon-Fri. Outside shifts, `ticket` builds cold instead.
on:
  schedule:
    - cron: "0 2 * * 1-5"   # 09:00 VN, 6h
    - cron: "0 8 * * 1-5"   # 15:00 VN, 3h
  workflow_dispatch:
    inputs:
      minutes: { description: "Shift length in minutes (max 350)", default: "120" }

permissions: {}

concurrency:
  group: shift
  cancel-in-progress: false

env:
  GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
  GITLAB_PROJECT: ${{ secrets.GITLAB_PROJECT }}
  JIRA_URL: ${{ secrets.JIRA_URL }}
  JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
  FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
  GH_TOKEN: ${{ secrets.TASKS_PAT }}
  TASKS_REPO: ${{ secrets.TASKS_REPO }}
  TG_TICKET_BOT_TOKEN: ${{ secrets.TG_TICKET_BOT_TOKEN }}
  TG_NOTIFY_CHAT_ID: ${{ secrets.TG_NOTIFY_CHAT_ID }}
  TG_SQUAD_TOPICS: ${{ secrets.TG_SQUAD_TOPICS }}
  CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
  CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
  CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
  MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.minutes || (github.event.schedule == '0 2 * * 1-5' && '350' || '175') }}

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 360
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
        with: { path: runner }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: shift
        run: bash runner/scripts/shift.sh ios

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
        with: { path: runner }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: shift-gradle-${{ github.run_id }}
          restore-keys: shift-gradle-
      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: shift
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash runner/scripts/shift.sh android
