name: shift
run-name: shift
# Work-hours QC shifts: a warm iOS simulator + Android emulator take queued tasks (labels ios-todo / android-todo).
# 09:00-15:00 and 15:00-18:00 Vietnam time, Mon-Fri. Outside shifts, `ticket` builds cold instead.
on:
  schedule:
    - cron: "0 2 * * 1-5"   # 09:00 VN, 6h
    - cron: "0 8 * * 1-5"   # 15:00 VN, 3h
  workflow_dispatch:
    inputs:
      minutes: { description: "Shift length in minutes (max 350 ≈ 6h job limit; a relay shift starts 20 min before the end)", default: "350" }
      ios_workers: { description: "iOS simulators (macOS free plan: max 5 at once)", default: "3" }
      android_workers: { description: "Android emulators (0 = none)", default: "3" }
      ios_runner: { description: "iOS machine: macos-26 (Apple Silicon, 3 cores 7GB) or macos-15-intel (Intel, 4 cores 14GB)", default: "macos-26" }

permissions: {}

concurrency:
  # Scheduled shifts never overlap; a manual shift (extra machines) gets its own group.
  group: shift-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.schedule }}
  cancel-in-progress: false

env:
  IOS_WORKERS: ${{ inputs.ios_workers || '3' }}
  ANDROID_WORKERS: ${{ inputs.android_workers || '3' }}
  GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
  GITLAB_PROJECT: ${{ secrets.GITLAB_PROJECT }}
  JIRA_URL: ${{ secrets.JIRA_URL }}
  JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
  FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
  GH_TOKEN: ${{ secrets.TASKS_PAT }}
  TASKS_REPO: ${{ secrets.TASKS_REPO }}
  TG_TICKET_BOT_TOKEN: ${{ secrets.TG_TICKET_BOT_TOKEN }}
  TG_NOTIFY_CHAT_ID: ${{ secrets.TG_NOTIFY_CHAT_ID }}
  TG_SQUAD_TOPICS: ${{ secrets.TG_SQUAD_TOPICS }}
  CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
  CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
  CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
  MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.minutes || (github.event.schedule == '0 2 * * 1-5' && '350' || '175') }}

jobs:
  # Worker counts → matrix lists. Schedules use the defaults (2 iOS, 3 Android).
  plan:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.p.outputs.ios }}
      android: ${{ steps.p.outputs.android }}
    steps:
      - id: p
        run: |
          r() { python3 -c "import json,sys;print(json.dumps(list(range(1,max(0,min(int(sys.argv[1]),$2))+1))))" "$1"; }
          echo "ios=$(r '${{ inputs.ios_workers || '3' }}' 5)" >> "$GITHUB_OUTPUT"
          echo "android=$(r '${{ inputs.android_workers || '3' }}' 8)" >> "$GITHUB_OUTPUT"

  ios:
    needs: plan
    if: needs.plan.outputs.ios != '[]'
    strategy:
      fail-fast: false
      matrix: { worker: "${{ fromJSON(needs.plan.outputs.ios) }}" }
    runs-on: ${{ inputs.ios_runner || 'macos-26' }}
    timeout-minutes: 360
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
        with: { path: runner }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/cache@v4
        with:
          path: |
            app/node_modules
            app/ios/Pods
            build
          key: shift-ios-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: shift-ios-${{ runner.arch }}-
      - name: shift
        env: { WORKER: "${{ matrix.worker }}" }
        run: bash runner/scripts/shift.sh ios

  android:
    needs: plan
    if: needs.plan.outputs.android != '[]'
    strategy:
      fail-fast: false
      matrix: { worker: "${{ fromJSON(needs.plan.outputs.android) }}" }
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
        with: { path: runner }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/node_modules
          key: shift-android-${{ github.run_id }}
          restore-keys: shift-android-
      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: shift
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: WORKER=${{ matrix.worker }} bash runner/scripts/shift.sh android
